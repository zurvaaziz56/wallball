[project]
name = "wallball"
version = "0.1.0"
description = "Live wall-tennis coach: pose, ball tracking, strokes, speed and placement from an iPhone camera"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.10",
    "numpy>=2.0,<2.4",
    "scipy>=1.13",
    "sounddevice>=0.5",
    "av>=13",
    "pyyaml>=6",
    "matplotlib>=3.9",
    "coremltools>=8",
    "pillow>=10",
]

[project.scripts]
wallball = "wallball.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wallball"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
